# ForensicRS test artifacts: the source of truth for tools/fetch.py and the HF dataset card.
# Field reference: README.md#manifest-fields. Add entries with tools/add_artifact.py.
#
# Rules:
#  * sha256 is of the final file (after archive extraction).
#  * hf_path only for redistributable = true, laid out as <source>/<format>/<id>/<file>.
#  * origin_url pinned to a commit / release, never a moving branch.
#  * no data from real cases or real people.

[dataset]
hf_repo = "ForensicRS/forensic-test-artifacts"
revision = "main"
# Private, gated: originals of non-redistributable files (cold_path), a fallback for dead
# origins. Only readable with an HF_TOKEN granted access; never made public.
cold_repo = "ForensicRS/forensic-test-artifacts-cold"

